<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artivy</title>

    <!--
      AdSense site verification. The publisher id is the same one as app-ads.txt, which is the
      same Google payments profile the Android apps bill through.

      It belongs here rather than in the `artivy` repo for exactly the reason app-ads.txt does:
      AdSense verifies a *domain*, and this is the only repo that can answer for the domain
      root. `artivy` is a project site served at /artivy/ and can never be the root.

      This tag alone does not place an advert. It is what lets Google confirm the site is ours,
      and it is what Auto ads would attach to if Auto ads were switched on — which they must
      not be while the game pages are unprepared for them. See ads.txt beside this file.
    -->
    <meta name="google-adsense-account" content="ca-pub-8668013395284480">
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8668013395284480"
        crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #faf9f5;
            color: #3d3d3a;
        }

        main {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            margin: 0 0 .5rem;
            font-size: 1.75rem;
            letter-spacing: -.02em;
        }

        p {
            margin: 0 0 1.5rem;
            color: #6b6b66;
        }

        a {
            color: #c15f3c;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- This page exists only so the domain root is not a bare 404. The real
         publisher site is the `artivy` project repo, served at /artivy/, and its
         URLs are hard-coded into shipped apps — so it is linked, never moved. -->
    <main>
        <h1>Artivy</h1>
        <p>Small games, made carefully.</p>
        <a href="/artivy/">Visit the site &rarr;</a>
    </main>
</body>

</html>
